<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Event</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="clg_event_style.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-lg-2 d-lg-block sidebar collapse" id="sidebarMenu">
          <div class="position-sticky pt-4 px-3">
            <h4 class="fw-bold mb-4">College Admin</h4>

            <ul class="nav flex-column">
              <li class="nav-item mb-2">
                <a class="nav-link active" href="#"
                  ><i class="bi bi-speedometer2 me-2"></i>Dashboard</a
                >
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link" href="#"
                  ><i class="bi bi-calendar-event me-2"></i>Events</a
                >
              </li>
              <li class="nav-item mb-2">
                <a class="nav-link" href="#"
                  ><i class="bi bi-people me-2"></i>Participants</a
                >
              </li>
            </ul>
          </div>
        </nav>
        <main class="col-lg-10 ms-sm-auto px-md-4 py-4">
          <nav class="navbar navbar-light d-lg-none mb-3">
            <button
              class="btn btn-dark"
              data-bs-toggle="collapse"
              data-bs-target="#sidebarMenu"
            >
              ☰ Menu
            </button>
          </nav>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="m-0">Event Overview</h4>
            <button
              class="btn btn-gradient d-flex align-items-center gap-2 px-4 py-2 shadow"
              data-bs-toggle="modal"
              data-bs-target="#addEventModal"
            >
              <i class="bi bi-plus-lg"></i>
              <span>Add Event</span>
            </button>
          </div>
          <div class="row g-4 mb-4">
            <div class="col-md-6 col-xl-3">
              <div class="card dashboard-card text-center p-3">
                <h6>
                  <i class="bi bi-calendar-event me-2 text-primary"></i>Total
                  Events
                </h6>
                <h2 id="totalCount">0</h2>
              </div>
            </div>

            <div class="col-md-6 col-xl-3">
              <div class="card dashboard-card text-center p-3">
                <h6>
                  <i class="bi bi-clock-fill me-2 text-primary"></i>Upcoming
                </h6>
                <h2 id="upcomingCount">0</h2>
              </div>
            </div>

            <div class="col-md-6 col-xl-3">
              <div class="card dashboard-card text-center p-3">
                <h6>
                  <i class="bi bi-check2-circle me-2 text-primary"></i>Completed
                </h6>
                <h2 id="completedCount">0</h2>
              </div>
            </div>
            <div class="col-md-6 col-xl-3">
              <div class="card dashboard-card text-center p-3">
                <h6>
                  <i class="bi bi-people-fill me-2 text-primary"></i
                  >Participants
                </h6>
                <h2 id="completedCount">60</h2>
              </div>
            </div>
          </div>
          <div class="row g-4" id="eventRow"></div>
        </main>
      </div>
    </div>
    <div class="modal fade" id="addEventModal">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Add New Event</h5>
            <button
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <form id="eventForm" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label text-black">Event Name</label>
                  <input type="text" class="form-control" required />
                  <div class="invalid-feedback">Enter event name</div>
                </div>

                <div class="col-md-6">
                  <label class="form-label text-black">Event Date</label>
                  <input type="date" class="form-control" required />
                  <div class="invalid-feedback">Select date</div>
                </div>

                <div class="col-12">
                  <label class="form-label text-black">Venue</label>
                  <input type="text" class="form-control" required />
                  <div class="invalid-feedback">Enter venue</div>
                </div>

                <div class="col-12">
                  <label class="form-label text-black">Description</label>
                  <textarea class="form-control" rows="3" required></textarea>
                  <div class="invalid-feedback">Enter description</div>
                </div>
              </div>

              <div class="mt-4 text-end">
                <button
                  type="submit"
                  class="btn btn-success d-flex align-items-center gap-2"
                >
                  <i class="bi bi-check-circle-fill"></i>
                  Save Event
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="clg_event_js.js"></script>
  </body>
</html>
