<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #828891, #d4cbe1);
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand">My App Login</span>
      </div>
    </nav>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="height: 90vh"
    >
      <div class="col-md-4 col-sm-8">
        <div class="card shadow-lg p-4">
          <h3 class="text-center mb-4">Login</h3>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" />
              <div id="emailError" class="text-danger small"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" />
              <div id="passwordError" class="text-danger small"></div>
            </div>

            <div class="d-grid mb-2">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
            <div class="text-center">
              <a href="register.html" class="btn btn-outline-dark btn-sm">
                Don't have an account? Register
              </a>
            </div>

            <div
              id="successMessage"
              class="text-success text-center mt-3"
            ></div>
          </form>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          let email = document.getElementById("email").value.trim();
          let password = document.getElementById("password").value.trim();

          let storedEmail = localStorage.getItem("registeredEmail");
          let storedPassword = localStorage.getItem("registeredPassword");

          let emailError = document.getElementById("emailError");
          let passwordError = document.getElementById("passwordError");
          let successMessage = document.getElementById("successMessage");

          emailError.textContent = "";
          passwordError.textContent = "";
          successMessage.textContent = "";

          let isValid = true;

          if (email === "") {
            emailError.textContent = "Email is required";
            isValid = false;
          }

          if (password === "") {
            passwordError.textContent = "Password is required";
            isValid = false;
          }

          if (isValid) {
            if (email === storedEmail && password === storedPassword) {
              successMessage.textContent = "Login Successful!";

              setTimeout(function () {
                window.location.href = "ecom.html";
              }, 1500);
            } else {
              passwordError.textContent = "Invalid Email or Password";
            }
          }
        });
    </script>
  </body>
</html>
