<!doctype html>
<html>
  <head>
    <title>Product Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ecom.css" />
  </head>

  <body>
    <div class="navbar">
      <h2>Shopee</h2>
      <div class="cart">Cart <span id="cart-count">0</span></div>
    </div>

    <div id="product-list" class="product-container">
      <div class="product">
        <img
          src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcTbhOpCZRyrftxn9vFk4ngnyjLj-9pDwNUMjjrBPfYSGqbbMvojuv5xcXu2KIzpwXtKJbwhafcp7Ilt3LsnnOQFNvaqNMGznELk8qMhCqiHEx33z_cdDGTHK50k-XaJoVmUyFpIcg&usqp=CAc"
        />
        <h3>Apples</h3>
        <p>Rs.400</p>
        <button class="add-btn">Add to Cart</button>
        <span class="msg"></span>
      </div>

      <div class="product">
        <img
          src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcTIHi29Abhubcf3CoqJPQ4V_OncXRKsdxAaK_hfxiA7vu0mnlPqOWkrtCQLjuZUi1QHIY-72K9hbJbL_zKONmDq5Sb2nMh7nWHZhb3BiHPy1sSrqX5TjztJXOa1IDNV5MksntRXkOU&usqp=CAc"
        />
        <h3>Milk</h3>
        <p>Rs.120</p>
        <button class="add-btn">Add to Cart</button>
        <span class="msg"></span>
      </div>

      <div class="product">
        <img
          src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcTUTbVwVTfwdejtincVGNy-hlKEP3YuztkASTiNBt0SG9PhkaWMMZ599qArCr5zeheLRbWFDieBkJRQxsIxohCV1hpTPv63ph_agLZ262C0EIBMs6NuU0GdTzHJCYGz3csKbCotnxo&usqp=CAc"
        />
        <h3>Rice Bag</h3>
        <p>Rs.1800</p>
        <button class="add-btn">Add to Cart</button>
        <span class="msg"></span>
      </div>

      <div class="product">
        <img
          src="https://cdn.mos.cms.futurecdn.net/v2/t:0,l:200,cw:1200,ch:1200,q:80,w:1200/ttRcAKkAuabG9JWzvahtiA.jpg"
        />
        <h3>Vegetables</h3>
        <p>Rs.400</p>
        <button class="add-btn">Add to Cart</button>
        <span class="msg"></span>
      </div>
    </div>
    <footer class="bg-success text-white text-center p-3">
      <p class="mb-0">© 2026 Shopee. All Rights Reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="ecom.js"></script>
  </body>
</html>
